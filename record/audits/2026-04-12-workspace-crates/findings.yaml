      - id: phases
        label: "7 phases, 12 hook points"
        type: process
      - id: done
        label: "Ship complete"
        type: end

    findings:
      - slug: redundant-git-current-branch-per-ship
        title: "git::current_branch() invoked twice per ship run for an invariant value"
        criterion: "PERF-12"
        surface: "Performance"
        concern: advisory
        locations:
          - path: crates/scrat-core/src/preflight.rs
            start_line: 188
            end_line: 198
        evidence: |
          fn check_release_branch(override_branch: Option<&str>) -> CheckResult {
              let current = match git::current_branch() {
                  Ok(Some(b)) => b,
                  Ok(None) => {
                      return CheckResult {
                          name: "Release branch".into(),
                          passed: false,
                          message: "Detached HEAD — not on any branch".into(),
                          skip_flag: None,
                      };
                  }
        evidence_lang: rust
        evidence_markers:
          - lines: "2"
            type: mark
            label: "first git rev-parse call in preflight"
        mechanism: |
          A ship run resolves the current branch in preflight (check_release_branch line 189)
          and again when building the PipelineContext in ReadyShip::execute() (ship.rs line
          448). Each call is a separate `git rev-parse --abbrev-ref HEAD` — a fork+exec that
          costs ~5-15ms on macOS. The branch cannot change between plan and execute within the
          same process, so the second call is pure waste. The Phase 4 ecosystem refactor
          deduplicated detection and preflight but did not thread branch through from preflight
          to execute.
        remediation: |
          Stash the branch result on ReadyShip (populated during plan_ship by reading
          report.checks or by calling current_branch once in plan_ship and passing it in
          alongside detection). Then read `self.branch` in execute() instead of re-invoking
          git. Alternatively, add a `ProjectDetection.branch: Option<String>` field if callers
          outside ship want it.
        chains:
          enables: []
          enabled_by: []
          related: [has-binary-path-probe-not-cached]
        effort: small
        effort_notes: "Add one field to ReadyShip, populate once in plan_ship, read in execute. ~15 lines."

      - slug: release-profile-missing-lto-and-strip
        title: "Release profile sets no optimizations beyond default — no LTO, no strip, default codegen-units"
        criterion: "PERF-8"
        surface: "Performance"
        concern: advisory
        locations:
          - path: Cargo.toml
            start_line: 57
            end_line: 59
        evidence: |
          # Release profile with reduced debug info
          [profile.release]
          debug = "line-tables-only"
        evidence_lang: toml
        evidence_markers:
          - lines: "2-3"
            type: mark
            label: "no lto, no strip, no codegen-units — every easy binary-size and startup-time lever unused"
        mechanism: |
          For a user-facing CLI invoked interactively (startup latency matters) and distributed
          via crates.io (binary size matters), the default release profile leaves easy wins on
          the table. With `lto = "thin"`, `codegen-units = 1`, and `strip = "symbols"`, a
          binary of this shape typically sees 10-20% smaller output and measurable
          startup-time improvements from better cross-crate inlining — especially between
          scrat-core and scrat given the thin-CLI architecture, where every command does
          `scrat → scrat_core::*`. Thin LTO adds 10-30s to a full release build, which is
          cheap insurance for binaries downloaded by users.
        remediation: |
          Add to [profile.release]:

              lto = "thin"
              codegen-units = 1
              strip = "symbols"

          Benchmark: `hyperfine --warmup 3 'scrat --version'` before and after. A startup
          improvement above 3ms is a win given that `scrat info` and `scrat preflight` are
          invoked interactively. If release build time becomes noticeable, downgrade to
          `lto = "thin"` + default codegen-units.
        chains:
          enables: []
          enabled_by: []
          related: []
        effort: trivial
        effort_notes: "Three lines in Cargo.toml. Verify `cargo build --release` still succeeds and measure startup."

      - slug: has-binary-path-probe-not-cached
        title: "detect::has_binary probes PATH ~5-8 times per ship run with no cache"
        criterion: "PERF-12"
        surface: "Performance"
        concern: note
        locations:
          - path: crates/scrat-core/src/detect.rs
            start_line: 131
            end_line: 134
        evidence: |
          /// Check whether a binary is available on `PATH`.
          pub fn has_binary(name: &str) -> bool {
              which::which(name).is_ok()
          }
        evidence_lang: rust
        evidence_markers:
          - lines: "3"
            type: mark
            label: "no memoization — each call walks PATH fresh"
        mechanism: |
          which::which walks PATH, stats each directory for the binary name, and on some
          platforms checks executable-ish variations. A single plan_ship invokes has_binary for:
          git-cliff (in detect_version_strategy), cargo, cargo-nextest, cargo-set-version (in
          RustDriver::detect), then in check_required_tools the same binaries are re-probed via
          `has_binary(test_cmd.split_whitespace().next())`, plus gh in check_gh_auth. Each
          probe is cheap (~1-2ms on a normal macOS PATH), but they aggregate to ~10-15ms of
          pure syscall cost per ship run. The binaries cannot move during a single process, so
          the probing is idempotent. Same binaries are also re-probed for `scrat info` and
          `scrat doctor`.
        remediation: |
          Wrap has_binary with a process-lifetime `OnceLock<Mutex<HashMap<String, bool>>>`:

              use std::sync::{Mutex, OnceLock};
              use std::collections::HashMap;
              static PATH_CACHE: OnceLock<Mutex<HashMap<String, bool>>> = OnceLock::new();
              pub fn has_binary(name: &str) -> bool {
                  let cache = PATH_CACHE.get_or_init(Default::default);
                  if let Some(&v) = cache.lock().unwrap().get(name) { return v; }
                  let v = which::which(name).is_ok();
                  cache.lock().unwrap().insert(name.to_owned(), v);
                  v
              }

          Shaves single-digit ms on ship but meaningful on `scrat info` (runs detection twice
          through the same call paths for display). Add a `#[cfg(test)] fn clear_path_cache()`
          if any test relies on detecting a binary installed mid-run.
        chains:
          enables: []
          enabled_by: []
          related: [redundant-git-current-branch-per-ship]
        effort: small
        effort_notes: "~20 lines including the cache and a test-only clear hook."

  - slug: feature-completeness-surface
    title: "The Feature Completeness Surface"
    thesis: "Seven ecosystems now ship real bump, deps, and detect behavior — the Node and Ruby gaps from the 2026-04-09 audit are closed. The remaining completeness debt has moved into `scrat notes` (the standalone preview diverges from the shipped artifact in two ways) and into the config surface, where three documented knobs have no implementation and example-config advertises OTel plumbing that doesn't exist."
    verdict: "The notes command is the most impactful fix. Users are sold a preview that can't regenerate past releases and won't include filter-hook mutations — a significant-level divergence between the command's promise and its behavior. The orphan config fields are each trivial individually but together erode trust across the config surface; honest fix is deletion unless the roadmap includes implementation soon. The UnsupportedEcosystem error variant is a leftover from the pre-Phase-4 era and should go."

    flow:
      - id: cli-args
        label: "scrat notes --from v1.0.0"
        type: start
      - id: parse
        label: "Parse PreviewNotesOptions"
        type: process
      - id: preview-notes
        label: "preview_notes()"
        type: process
      - id: resolve-tag
        label: "Resolve previous_tag (uses --from ✓)"
        type: process
      - id: compute-deps
        label: "deps::compute_deps (uses previous_tag ✓)"
        type: process
      - id: compute-stats
        label: "stats::compute_stats (uses previous_tag ✓)"
        type: process
      - id: hooks-gap
        label: "hooks::run_hooks?"
        type: decision
        no: render
        findings:
          - slug: notes-command-skips-all-hooks
            label: "Never called"
      - id: render
        label: "render_notes → run_cliff_context"
        type: process
        spine: false
        next: cliff
      - id: cliff
        label: "git-cliff --unreleased --context"
        type: process
        findings:
          - slug: notes-from-flag-ignored-by-cliff-context
            label: "ignores --from tag"
      - id: notes-out
        label: "Notes rendered or empty"
        type: end

    findings:
      - slug: notes-from-flag-ignored-by-cliff-context
        title: "`scrat notes --from` does not affect the rendered release notes"
        criterion: "14.1"
        surface: "Feature Completeness"
        concern: significant
        locations:
          - path: crates/scrat-core/src/notes.rs
            start_line: 347
            end_line: 371
        evidence: |
          /// Run `git-cliff --unreleased --context` and capture JSON output.
          fn run_cliff_context(project_root: &Utf8Path) -> Result<String, NotesError> {
              let output = Command::new("git-cliff")
                  .args(["--unreleased", "--context"])
                  .current_dir(project_root.as_std_path())
                  .output()
                  .map_err(|e| NotesError::CliffContext(format!("failed to execute git-cliff: {e}")))?;

              if !output.status.success() {
                  let stderr = String::from_utf8_lossy(&output.stderr).trim().to_string();
                  return Err(NotesError::CliffContext(format!(
                      "git-cliff exited with {}: {stderr}",
                      output.status
                  )));
              }

              let stdout = String::from_utf8_lossy(&output.stdout).to_string();
              if stdout.trim().is_empty() {
                  return Err(NotesError::CliffContext(
                      "git-cliff produced empty context output".into(),
                  ));
              }

              Ok(stdout)
          }
        evidence_lang: rust
        evidence_markers:
          - lines: "4"
            type: del
            label: "hardcoded --unreleased; no tag range, no reference to previous_tag"
        mechanism: |
          README documents `scrat notes --from v1.0.0` as "diff against specific tag" and the
          CLI help text declares --from as the "Previous version tag to diff against". The
          implementation stores options.from in previous_tag for stats and dep-diff computation,
          but the git-cliff invocation that produces the actual notes body always passes
          `--unreleased --context` with no range selector. For any already-tagged release the
          call returns an empty context and preview_notes fails with "git-cliff produced empty
          context output" — historical release notes cannot be regenerated. The --from flag
          influences two side channels (stats, deps) but not the primary artifact the command
          produces. This matches the "notes CLI can't regenerate past releases" gap already
          recorded in project memory.
        remediation: |
          Forward the resolved previous_tag to git-cliff as a range/tag selector — either
          `--tag <new-tag>` paired with a range like `<from>..HEAD`, or a per-release
          `--tag-pattern`. Fall back to `--unreleased` only when no explicit --from is provided
          and no prior tag exists.
        chains:
          enables: []
          enabled_by: []
          related: [notes-command-skips-all-hooks]
        effort: small
        effort_notes: "Swap one Command::new arg list; previous_tag is already in scope."

      - slug: notes-command-skips-all-hooks
        title: "`scrat notes` never runs hooks — preview diverges from shipped artifact"
        criterion: "14.1"
        surface: "Feature Completeness"
        concern: advisory
        locations:
          - path: crates/scrat-core/src/notes.rs
            start_line: 158
            end_line: 175
        evidence: |
              // Compute stats
              if !options.no_stats && !previous_tag.is_empty() {
                  ctx.stats = stats::compute_stats(&ctx.previous_tag);
                  if ctx.stats.is_some() {
                      debug!("stats computed");
                  }
              }

              // Determine template: options > config > built-in
              let template = options.template.as_deref().or_else(|| {
                  config
                      .release
                      .as_ref()
                      .and_then(|r| r.notes_template.as_deref())
              });

              // Render
              let notes = render_notes(project_root, &ctx, template)?;
        evidence_lang: rust
        evidence_markers:
          - lines: "1-18"
            type: mark
            label: "no hooks::run_hooks call anywhere between ctx population and render"
        mechanism: |
          README frames `scrat notes` as a low-friction preview of what ship will produce:
          "Renders release notes without shipping. Useful for previewing what the notes will
          look like." When `scrat ship` runs, filter: hooks (and any post-bump hook that
          mutates metadata) can rewrite the PipelineContext that feeds git-cliff.
          preview_notes never calls hooks::run_hooks, so users who rely on filter hooks to
          shape release notes (the whole point of the filter: prefix) see a preview that does
          not match the artifact ship will produce. This matches the "notes CLI skips hooks"
          gap already recorded in project memory.
        remediation: |
          Thread config.hooks through preview_notes and execute at least the applicable
          filter: and post_bump-phase hooks against the preview context before calling
          render_notes. Alternatively, document `scrat notes` as a pre-hook preview and direct
          users to `scrat ship --dry-run` for hook-aware previews.
        chains:
          enables: []
          enabled_by: [notes-from-flag-ignored-by-cliff-context]
          related: []
        effort: small
        effort_notes: "Invoke existing hooks::run_hooks; no new machinery needed."

      - slug: orphan-commands-build-and-clean-config
        title: "commands.build and commands.clean are parsed, documented, but never read"
        criterion: "14.1"
        surface: "Feature Completeness"
        concern: advisory
        locations:
          - path: crates/scrat-core/src/config.rs
            start_line: 105
            end_line: 115
        evidence: |
          #[derive(Debug, Clone, Default, Deserialize, Serialize, PartialEq, Eq)]
          pub struct CommandsConfig {
              /// Override the test command (e.g., `"cargo nextest run"`).
              pub test: Option<String>,
              /// Override the build command (e.g., `"cargo build --release"`).
              pub build: Option<String>,
              /// Override the publish command (e.g., `"cargo publish"`).
              pub publish: Option<String>,
              /// Override the clean command.
              pub clean: Option<String>,
          }
        evidence_lang: rust
        evidence_markers:
          - lines: "6"
            type: mark
            label: "build — declared and doc'd, no production read"
          - lines: "10"
            type: mark
            label: "clean — declared and doc'd, no production read"
        mechanism: |
          README Configuration > Full Reference and config/scrat.toml.example (line 58-62)
          advertise commands.build and commands.clean as override knobs. A repo-wide grep for
          every `.build` and `.clean` reference in the core crate finds these fields only in
          the struct definition and a single deserialization round-trip test — no phase reads
          config.commands.build or config.commands.clean, and scrat has neither a `build` nor a
          `clean` subcommand. A user who sets `[commands] build = "just package"` sees no
          feedback, no warning, and no behavior change. Silent no-op config erodes trust in
          every other config surface.
        remediation: |
          Either wire these into the pipeline (e.g., auto-invoke commands.build before the
          publish phase if set) or delete both fields with their example-config entries and
          README mentions. Given no build/clean phase is on the stated roadmap, prefer
          deletion.
        chains:
          enables: []
          enabled_by: []
          related: [orphan-release-changelog-tool-config, example-config-advertises-unimplemented-otel-and-env]
        effort: trivial
        effort_notes: "Delete two fields and their doc comments, or extend ship.rs to read them."

      - slug: orphan-release-changelog-tool-config
        title: "release.changelog_tool config field is parsed but never consulted"
        criterion: "14.1"
        surface: "Feature Completeness"
        concern: advisory
        locations:
          - path: crates/scrat-core/src/config.rs
            start_line: 117
            end_line: 121
        evidence: |
          /// Release workflow configuration.
          #[derive(Debug, Clone, Default, Deserialize, Serialize, PartialEq, Eq)]
          pub struct ReleaseConfig {
              /// Override the changelog tool (currently only `"git-cliff"` is supported).
              pub changelog_tool: Option<ChangelogTool>,
        evidence_lang: rust
        evidence_markers:
          - lines: "5"
            type: mark
            label: "parsed and doc'd; production reads `detection.tools.changelog_tool` instead"
        mechanism: |
          config/scrat.toml.example line 69 advertises `changelog_tool = "git-cliff"` as a
          release knob. In practice scrat derives the changelog tool from VersionStrategy in
          each driver's detect() and production reads consult detection.tools.changelog_tool.
          A repo-wide grep for `release.changelog_tool` as a Rust expression finds only the
          struct field and a deserialization round-trip test. No code path feeds a user-provided
          release.changelog_tool back into detection or pipeline flow. The knob is silently
          accepted and silently ignored.
        remediation: |
          Either honor the override (propagate the value into DetectedTools.changelog_tool when
          set) or remove the field and its example-config entry. Current state is documented
          behavior with no implementation.
        chains:
          enables: []
          enabled_by: []
          related: [orphan-commands-build-and-clean-config]
        effort: trivial

      - slug: example-config-advertises-unimplemented-otel-and-env
        title: "otel_endpoint and SCRAT_ENV documented in example config are unimplemented"
        criterion: "14.1"
        surface: "Feature Completeness"
        concern: note
        locations:
          - path: config/scrat.toml.example
            start_line: 26
            end_line: 36
        evidence: |
          # Log files are written as JSONL with daily rotation.
          # Default paths:
          # - /var/log/scrat.jsonl (Unix, if writable)
          # - ~/.local/share/scrat/logs/scrat.jsonl (fallback)
          # Override with environment variables:
          # - SCRAT_LOG_PATH=/path/to/scrat.jsonl  (rotated daily)
          # - SCRAT_LOG_DIR=/path/to/log/dir
          # - SCRAT_ENV=dev
          # Config options:
          # - log_dir = "/path/to/log/dir"
          # - otel_endpoint = "http://127.0.0.1:4317"
        evidence_lang: toml
        evidence_markers:
          - lines: "8"
            type: mark
            label: "SCRAT_ENV env var not read in any crate"
          - lines: "11"
            type: mark
            label: "otel_endpoint not declared on Config and not read"
        mechanism: |
          The canonical example config advertises two integration points that do not exist in
          source: SCRAT_ENV (claimed env-var override) and otel_endpoint (claimed config knob).
          A repo-wide grep for `SCRAT_ENV` and `otel` in crates/ returns zero matches — Config
          has no otel_endpoint field; the observability module never reads the env var. A user
          following the example config to wire an OTel collector sees no spans and no error.
        remediation: |
          Either land the OTel endpoint plumbing against the existing observability module or
          remove both references from config/scrat.toml.example and from the init templates if
          they mirror it.
        chains:
          enables: []
          enabled_by: []
          related: [orphan-commands-build-and-clean-config]
        effort: trivial

      - slug: bump-error-unsupported-ecosystem-dead-variant
        title: "BumpError::UnsupportedEcosystem is declared but never returned in production"
        criterion: "14.3"
        surface: "Feature Completeness"
        concern: note
        locations:
          - path: crates/scrat-core/src/bump.rs
            start_line: 43
            end_line: 49
        evidence: |
              /// No bump tool available for this ecosystem.
              #[error("no bump tool available (install cargo-edit for Rust)")]
              NoBumpTool,

              /// Ecosystem not supported for bump operations.
              #[error("bump not yet supported for {0} ecosystem")]
              UnsupportedEcosystem(Ecosystem),
        evidence_lang: rust
        evidence_markers:
          - lines: "5-7"
            type: del
            label: "no production constructor — only referenced by a display test (bump.rs:786)"
        mechanism: |
          After Phase 4 (PR #43) every driver implements bump_version_files with real behavior
          or an explicit `Ok(Vec::new())` no-op (Go, Swift, Generic). The only BumpError
          variants production code returns are ToolFailed, NoBumpTool, Detection, and Version.
          UnsupportedEcosystem is constructed only in a single unit test
          (bump_error_unsupported_ecosystem_display at bump.rs:786). Its error message "bump
          not yet supported for {0} ecosystem" is misleading — downstream consumers matching
          on it write unreachable code.
        remediation: |
          Remove the variant and the display-only test. If a future scenario truly needs to
          refuse bump for an ecosystem, reintroduce with a real call site.
        chains:
          enables: []
          enabled_by: []
          related: []
        effort: trivial

      - slug: example-config-missing-filter-prefix-docs
        title: "Example config documents sync: hook prefix but omits filter:"
        criterion: "14.5"
        surface: "Feature Completeness"
        concern: note
        locations:
          - path: config/scrat.toml.example
            start_line: 82
            end_line: 92
        evidence: |
          # ------------------------------------------------------------------------------
          # Hooks (pre/post commands per phase of `scrat ship`)
          # ------------------------------------------------------------------------------
          # Variables: {version}, {prev_version}, {tag}, {changelog_path}, {owner}, {repo}
          #
          # Commands run in parallel by default. Prefix with "sync:" to create a
          # barrier — all prior commands finish, the sync command runs alone, then
          # subsequent commands resume in parallel.
          #
          # Phase order:
          #   pre_ship → test → bump → git → release → publish → post_ship
        evidence_lang: toml
        evidence_markers:
          - lines: "6-8"
            type: mark
            label: "sync: documented; filter: absent despite README and implementation support"
        mechanism: |
          README documents filter: as a first-class hook prefix with JSON pipe semantics and a
          full TOML example. The canonical config/scrat.toml.example documents only sync:.
          Users starting from the example config — especially those who follow the scrat init
          scaffolds that mirror it — would not discover the filter: capability without reading
          the README end-to-end. The implementation in hooks.rs::split_batches supports both
          prefixes; this is documentation drift rather than a missing feature.
        remediation: |
          Add a filter: paragraph and example to config/scrat.toml.example alongside the sync:
          paragraph. README prose can be lifted verbatim.
        chains:
          enables: []
          enabled_by: []
          related: []
        effort: trivial

