      the tree despite the project already using serde-saphyr for all YAML
      work. Removing the feature flag is a one-line Cargo.toml change; the
      harder part is building a thin figment Provider backed by serde-saphyr.
      Audit tooling had environment issues that prevented full automated
      scanning, but manual checks found no advisories.

