    findings:
      - slug: figment-yaml-pulls-deprecated-dep
        title: "Figment 'yaml' feature pulls deprecated serde_yaml into dependency tree"
        concern: moderate

        locations:
          - path: crates/scrat-core/Cargo.toml
            start_line: 35
            end_line: 35

        evidence: |
          figment = { version = "0.10", features = ["toml", "yaml", "json"] }

        mechanism: |
          Figment's "yaml" feature gates on serde_yaml as its YAML provider
          backend. serde_yaml v0.9.34 is explicitly marked "+deprecated" in its
          version string and archived upstream. Its sole dependency, unsafe-libyaml
          v0.2.11, wraps C code and contains unsafe blocks. While the workspace-level
          `unsafe_code = "deny"` lint prevents unsafe in project code, it does not
          apply to external crates. The project already uses serde-saphyr (a pure-Rust
          YAML library) as a direct dependency in the CLI crate, making the serde_yaml
          transitive completely redundant. This contradicts the documented project
          policy that lists serde_yaml as a disliked dependency.

        remediation: |
          Remove "yaml" from figment's feature list:
            figment = { version = "0.10", features = ["toml", "json"] }
          Then implement a custom figment::Provider backed by serde-saphyr
          for YAML config file support. Alternatively, file a feature request
          on figment for a serde-saphyr backend. The custom Provider approach
          is straightforward: read the YAML file, deserialize with serde-saphyr
          into a serde_json::Value, and feed it into figment.

        temporal:
          introduced: "2026-03-01"
          last_modified: "2026-04-03"
