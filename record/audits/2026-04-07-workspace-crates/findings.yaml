  - slug: dependency-fitness-surface
    title: "The Dependency Fitness Surface"
    thesis: >-
      Dependency choices are well-matched to the project's needs, with two
      minor hygiene items: a redundant manifest entry and a library-to-CLI
      framework coupling.
    verdict: >-
      The dependency tree is lean for a CLI tool of this scope: no async
      runtime, no HTTP client, no image processing. 149 transitive crates
      is reasonable. The two findings are architectural cleanliness items,
      not risks. Both are low-effort fixes that would tighten the
      dependency graph without changing behavior.

    findings:
      - slug: directories-redundant-in-cli
        title: "directories crate declared in CLI Cargo.toml but unused"
        concern: note

        locations:
          - path: crates/scrat/Cargo.toml
            start_line: 55
            end_line: 55

        evidence: |
          directories = "6.0"

        mechanism: |
          The CLI crate declares directories as a direct dependency, but has
          zero `use directories` statements in its source code. All directory
          resolution (XDG config, cache, data, log paths) happens in scrat-core's
          config.rs and observability.rs modules. Cargo deduplicates the version
          so there is no binary size impact, but it is dead manifest weight that
          could confuse future contributors. cargo-machete correctly flagged
          this; cargo-udeps did not (udeps considers workspace-level usage).

        remediation: |
          Remove `directories = "6.0"` from crates/scrat/Cargo.toml.

        temporal:
