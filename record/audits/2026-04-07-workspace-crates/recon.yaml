boundaries:
  - name: shell_execution
    description: >-
      Modules that spawn subprocesses (git, git-cliff, gh, cargo). User-
      provided hook commands are interpolated and executed via shell.
    modules: [hooks, git, notes, ship, bump, preflight, version]
    notes: >-
      Hook commands come from user config and are executed directly via
      shell. Variable interpolation uses a simple brace replacement.
      This is the primary trust boundary.

  - name: config_parsing
    description: >-
      Configuration loaded from YAML/TOML/JSON files discovered on disk
      and merged via Figment. Untrusted input from project-local config.
    modules: [config]
    notes: >-
      Config files are deserialized into strongly-typed structs via serde.
      Unknown fields are silently ignored (Figment behavior).

  - name: external_tool_output
    description: >-
      Output from git, git-cliff, gh parsed as strings or JSON.
      Subprocess exit codes drive control flow.
    modules: [git, notes, version, preflight, detect]
    notes: >-
      git-cliff context is parsed as JSON. git output is parsed
      line-by-line. Exit code checking is inconsistent in some paths.
